<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Area Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Velocity Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.8" />
    </linearGradient>

    <!-- Secondary Ghost / Target Gradient -->
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter for Points & Peak Lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Telemetry Horizontal Grid Lines (WPM levels) -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="4 6">
    <line x1="80" y1="100" x2="1520" y2="100" />
    <line x1="80" y1="180" x2="1520" y2="180" />
    <line x1="80" y1="260" x2="1520" y2="260" />
    <line x1="80" y1="340" x2="1520" y2="340" />
    <line x1="80" y1="420" x2="1520" y2="420" />
  </g>

  <!-- WPM Axis Labels -->
  <g font-family="monospace" font-size="11" fill="rgba(148, 163, 184, 0.45)" letter-spacing="1">
    <text x="85" y="95">160 WPM — PEAK THRESHOLD</text>
    <text x="85" y="175">130 WPM — APEX TIER</text>
    <text x="85" y="255">100 WPM — PRO TYPIST</text>
    <text x="85" y="335">70 WPM — RHYTHM BASE</text>
    <text x="85" y="415">40 WPM</text>
  </g>

  <!-- Vertical Time Guide Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="200" y1="80" x2="200" y2="460" />
    <line x1="440" y1="80" x2="440" y2="460" />
    <line x1="680" y1="80" x2="680" y2="460" />
    <line x1="920" y1="80" x2="920" y2="460" />
    <line x1="1160" y1="80" x2="1160" y2="460" />
    <line x1="1400" y1="80" x2="1400" y2="460" />
  </g>

  <!-- Time Labels along bottom -->
  <g font-family="monospace" font-size="10" fill="rgba(148, 163, 184, 0.35)" letter-spacing="1">
    <text x="195" y="450">00:00</text>
    <text x="435" y="450">00:15</text>
    <text x="675" y="450">00:30</text>
    <text x="915" y="450">00:45</text>
    <text x="1155" y="450">01:00</text>
    <text x="1395" y="450">FINISH</text>
  </g>

  <!-- Secondary Baseline Pacing Curve (Ghost / Target Reference) -->
  <path 
    d="M 80 370 
       C 220 350, 340 310, 460 270 
       C 580 230, 700 240, 820 210 
       C 940 180, 1060 190, 1180 160 
       C 1300 130, 1420 145, 1520 135" 
    fill="none" 
    stroke="url(#ghostGrad)" 
    stroke-width="2" 
    stroke-dasharray="6 6"
  />

  <!-- Primary Performance Telemetry Area Fill (WPM Velocity) -->
  <path 
    d="M 80 460 
       L 80 380 
       C 160 375, 230 330, 310 300 
       C 390 270, 440 285, 510 230 
       C 570 180, 640 195, 720 150 
       C 800 110, 860 160, 930 120 
       C 1010 80, 1080 135, 1160 110 
       C 1240 85, 1310 100, 1390 90 
       C 1450 82, 1490 95, 1520 88 
       L 1520 460 
       Z" 
    fill="url(#areaGrad)" 
  />

  <!-- Primary Performance Telemetry Line (High Precision Velocity Spline) -->
  <path 
    d="M 80 380 
       C 160 375, 230 330, 310 300 
       C 390 270, 440 285, 510 230 
       C 570 180, 640 195, 720 150 
       C 800 110, 860 160, 930 120 
       C 1010 80, 1080 135, 1160 110 
       C 1240 85, 1310 100, 1390 90 
       C 1450 82, 1490 95, 1520 88" 
    fill="none" 
    stroke="url(#strokeGrad)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- High-Velocity Micro Keystroke Rhythm Wave (Fast ripple line) -->
  <path 
    d="M 310 300 
       Q 350 285, 390 270 
       Q 450 250, 510 230 
       Q 590 190, 660 170 
       Q 720 150, 770 130 
       Q 840 125, 930 120 
       Q 1020 90, 1160 110 
       Q 1270 92, 1390 90" 
    fill="none" 
    stroke="rgba(56, 189, 248, 0.3)" 
    stroke-width="1.5" 
    stroke-dasharray="2 4"
  />

  <!-- Glowing Telemetry Data Nodes -->

  <!-- Node 1: Acceleration Point -->
  <g transform="translate(510, 230)" filter="url(#glow)">
    <circle r="4" fill="#818cf8" />
    <circle r="8" fill="none" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <line x1="0" y1="8" x2="0" y2="220" stroke="rgba(129, 140, 248, 0.15)" stroke-dasharray="2 3" />
  </g>

  <!-- Node 2: Peak Burst Point (148 WPM) -->
  <g transform="translate(1010, 80)" filter="url(#strongGlow)">
    <circle r="5" fill="#38bdf8" />
    <circle r="11" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" />
    <circle r="18" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
    <line x1="0" y1="18" x2="0" y2="370" stroke="rgba(56, 189, 248, 0.2)" stroke-dasharray="3 3" />
    
    <!-- Peak Badge -->
    <g transform="translate(14, -18)">
      <rect width="112" height="26" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="12" cy="13" r="3.5" fill="#38bdf8" />
      <text x="22" y="17" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" letter-spacing="0.5">148 WPM PEAK</text>
    </g>
  </g>

  <!-- Node 3: Flow State Node -->
  <g transform="translate(720, 150)" filter="url(#glow)">
    <circle r="4" fill="#a855f7" />
    <circle r="9" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Flow Badge -->
    <g transform="translate(-105, -16)">
      <rect width="95" height="24" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
      <text x="10" y="16" font-family="monospace" font-size="9" font-weight="bold" fill="#e9d5ff">FLOW 126 WPM</text>
    </g>
  </g>

  <!-- Node 4: Finish Speed Node -->
  <g transform="translate(1390, 90)" filter="url(#glow)">
    <circle r="4.5" fill="#4ade80" />
    <circle r="9" fill="none" stroke="#4ade80" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Accuracy Tag -->
    <g transform="translate(14, -14)">
      <rect width="90" height="24" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#4ade80" stroke-width="1" stroke-opacity="0.6" />
      <text x="10" y="16" font-family="monospace" font-size="9" font-weight="bold" fill="#86efac">99.8% ACC</text>
    </g>
  </g>

  <!-- Top Right Mini Telemetry HUD Watermark -->
  <g transform="translate(1260, 30)" opacity="0.75" font-family="monospace">
    <rect width="240" height="42" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="16" y="19" font-size="9" fill="#94a3b8" letter-spacing="1">TELEMETRY STREAM</text>
    <text x="16" y="32" font-size="11" font-weight="bold" fill="#38bdf8">148 WPM <tspan fill="#64748b" font-weight="normal">|</tspan> <tspan fill="#4ade80">99.8%</tspan> <tspan fill="#64748b" font-weight="normal">|</tspan> <tspan fill="#a855f7">0.4ms</tspan></text>
  </g>
</svg>
